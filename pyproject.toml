[project]
name = "millie-rec"
version = "0.1.0"
description = "밀리의서재 사전과제 ① — 메인 영역 추천 시스템 5일 데모 (Retrieval → Ranking → Re-ranking → Serving)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/millie_rec"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["demo", ".planning"]  # demo 레인은 별도 규칙(.claude/rules/demo.md), Python 패키지 아님. .planning 은 GSD 문서(ruff 0.16 이 md 코드 블록을 포맷하므로 제외)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
