<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
document.querySelectorAll("pre > code.mermaid, pre.mermaid").forEach(el => {
  const pre = el.tagName === "PRE" ? el : el.parentElement;
  const div = document.createElement("div"); div.className = "mermaid"; div.textContent = el.textContent;
  pre.replaceWith(div);
});
mermaid.initialize({ startOnLoad: true, theme: "neutral" });
</script>
<style>
body{max-width:820px;margin:auto;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:10.5pt;line-height:1.5}
table{border-collapse:collapse;font-size:9pt;width:100%} td,th{border:1px solid #bbb;padding:3px 6px}
.mermaid{margin:8px 0} h2{page-break-before:auto;margin-top:1.2em} blockquote{border-left:3px solid #999;padding-left:.8em;color:#333}
@media print{ .mermaid svg{max-width:100%} }
</style>
